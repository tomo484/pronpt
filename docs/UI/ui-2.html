<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Image Replication Challenge</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#1313ec",
            "background-light": "#f6f6f8",
            "background-dark": "#101022",
          },
          fontFamily: {
            "display": ["Space Grotesk", "sans-serif"]
          },
          borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
        },
      },
    }
  </script>
<style>
    body {
      font-family: 'Space Grotesk', sans-serif;
    }
  </style>
</head>
<body>
<div class="relative flex h-auto min-h-screen w-full flex-col bg-background-light dark:bg-background-dark group/design-root overflow-x-hidden">
<div class="layout-container flex h-full grow flex-col">
<div class="px-4 md:px-10 lg:px-40 flex flex-1 justify-center py-5">
<div class="layout-content-container flex flex-col max-w-[960px] flex-1">
<div class="flex flex-wrap justify-center gap-3 p-4">
<p class="text-gray-900 dark:text-white text-4xl font-black leading-tight tracking-[-0.033em] min-w-72 text-center">Image Replication Challenge</p>
</div>
<div class="flex w-full grow bg-background-light dark:bg-background-dark @container p-4 justify-center">
<div class="w-full max-w-2xl gap-1 overflow-hidden bg-background-light dark:bg-background-dark @[480px]:gap-2 aspect-[4/3] rounded-xl flex border border-gray-200 dark:border-[#333333]">
<div class="w-full bg-center bg-no-repeat bg-cover aspect-auto rounded-lg flex-1" data-alt="A futuristic city skyline at dusk with flying vehicles and neon lights." style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuBjoEJ5k7mJnkzL2sElQMxeTSOBnM7x_uy5pIAPWZvDgIolPfQpcPcJL5CGnK6L0PqRdT9jkY8TOs1pXQPy5_LcZPX-xHvxaVlMfcRk0lt_LpHi7dHoz7uuMEzHiFjUusfzAaCMUxJoDHpjB62FhrHdWfptaRZKV2ePJYTfaz8plQrXw4F-PgEijB08fCHV4yEta2C1CESXfhrWuaLYgvDmwt_xUCruO-FnrQpNr1nV86BxQ5xLtRNFu5zMy4mbgz3B4h7Xo-FWBl8");'></div>
</div>
</div>
<div class="flex flex-col items-center gap-4 px-4 py-3">
<label class="flex flex-col w-full max-w-2xl">
<div class="flex justify-between items-center pb-2">
<p class="text-gray-900 dark:text-white text-base font-medium leading-normal">Prompt</p>
<div class="relative group">
<span class="material-symbols-outlined text-gray-500 dark:text-gray-400 cursor-pointer">help</span>
<div class="absolute bottom-full mb-2 w-64 bg-gray-800 text-white text-sm rounded-lg p-2 opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none">
<strong>Pro-Tip:</strong> Be descriptive! Mention colors, shapes, and the overall mood of the image for better results.
                  </div>
</div>
</div>
<textarea class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-gray-900 dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary border-gray-200 dark:border-[#333333] bg-gray-50 dark:bg-[#1E1E1E] focus:border-primary dark:focus:border-primary min-h-36 placeholder:text-gray-400 dark:placeholder:text-gray-500 p-[15px] text-base font-normal leading-normal" placeholder="Describe the image in detail..."></textarea>
<p class="text-right text-gray-500 dark:text-gray-400 text-sm pt-1">0/1000 characters</p>
</label>
<div class="flex px-4 py-3 justify-center w-full max-w-2xl">
<button class="flex min-w-[84px] w-full cursor-pointer items-center justify-center overflow-hidden rounded-lg h-12 px-5 bg-primary text-white text-base font-bold leading-normal tracking-[0.015em] hover:bg-primary/90 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-background-dark focus:ring-primary">
<span class="truncate">Generate My Image</span>
</button>
</div>
</div>
</div>
</div>
</div>
</div>
</body></html>
